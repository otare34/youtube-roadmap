<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ゼロからYouTube 収益化ロードマップ</title>
<style>
:root{color-scheme:light;--bg:#f4f3f0;--card:#fcfcfb;--line:#dcd9d2;--ink:#111110;--sub:#55534e;--accent:#2a78d6;--danger:#d92b1f}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;--bg:#121211;--card:#1a1a19;--line:#33332f;--ink:#f7f7f4;--sub:#c3c2b7;--accent:#3987e5;--danger:#f0554a}
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
 background:var(--bg);color:var(--ink);
 font-family:"Meiryo UI",Meiryo,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Segoe UI",system-ui,sans-serif;
 font-feature-settings:"palt" 1;letter-spacing:.015em}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;
 padding:34px 30px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.07)}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:600;margin:0 0 12px}
h1{font-size:21px;line-height:1.55;margin:0 0 6px;font-weight:700}
.sub{font-size:13.5px;color:var(--danger);font-weight:700;margin:0 0 22px}
label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:7px}
input{width:100%;font:inherit;font-size:15px;padding:11px 14px;border-radius:10px;
 border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:12px;font:inherit;font-size:15px;font-weight:700;padding:12px;
 border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;margin-top:12px;font-size:12.5px;color:var(--danger)}
.note{margin:18px 0 0;font-size:11.5px;color:var(--sub);line-height:1.8}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <p class="eyebrow">PASSWORD REQUIRED</p>
  <h1>ゼロからYouTube 収益化ロードマップ</h1>
  <p class="sub">絶対にやってはいけない3つのこと</p>
  <label for="pw">パスワードを入力してください</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button id="go" type="submit">開く</button>
  <div class="msg" id="msg"></div>
  <p class="note">このページの内容は暗号化されています。正しいパスワードを入力するまで、中身は端末に復号されません。</p>
</form>
